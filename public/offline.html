<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRemise - Mode Hors Ligne</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #89ccff 0%, #407ebe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 20px;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: #f3f4f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }
        h1 {
            color: #1f2937;
            margin-bottom: 16px;
            font-size: 24px;
        }
        p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .features {
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .features h3 {
            color: #1f2937;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .features ul {
            color: #6b7280;
            margin: 0;
            padding-left: 20px;
        }
        .features li {
            margin-bottom: 8px;
        }
        .button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .button:hover {
            background: #2563eb;
        }
        .logo {
            margin-top: 30px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📱</div>
        <h1>Mode Hors Ligne</h1>
        <p>AutoRemise fonctionne hors ligne ! Vous pouvez toujours utiliser les fonctionnalités principales même sans connexion internet.</p>
        
        <div class="features">
            <h3>✅ Disponible hors ligne :</h3>
            <ul>
                <li>Génération de PDFs</li>
                <li>Traitement des fichiers Excel</li>
                <li>Templates de mapping</li>
                <li>Éditeur de templates</li>
            </ul>
        </div>
        
        <button class="button" onclick="window.location.href='/'">
            Retour à l'Accueil
        </button>
        
        <div class="logo">
            <img src="/logo-shamashit.png" alt="AutoRemise" style="height: 40px;">
        </div>
    </div>
</body>
</html>
